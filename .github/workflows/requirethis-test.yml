name: RequireThisCheckTest

on:
  push:
    branches:
      - tp1-refactor
  workflow_dispatch:

jobs:
  test:
    name: RequireThisCheckTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run RequireThisCheckTest
        run: mvn -B test -Dtest=RequireThisCheckTest -DfailIfNoTests=false
